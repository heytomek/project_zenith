[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zenith-schemas"
version = "0.1.0"
description = "Shared schemas for the Zenith planning platform"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9,<3.0"
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

